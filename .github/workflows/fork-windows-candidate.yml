name: Build Yuyu Fork Windows candidate (unsigned)

on:
  push:
    branches:
      - feat/gg-edgeone-api-delivery-20261115
    # 所有推送都必须生成与分支 HEAD 对应的 Release，避免文档提交
    # 导致后台更新器寻找不存在的 SHA 标签。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Yuyu fork commit
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed" }

      - name: Validate Windows code and deployment script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = 'tools/windows/Deploy-Yuyu.ps1'
          $bytes = [IO.File]::ReadAllBytes($src)
          if ($bytes.Count -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw "UTF-8 BOM required for PowerShell 5.1" }
          $tokens = $null; $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $src).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ("PowerShell 5.1 parse errors: " + ($errors | Out-String)) }
          $update = 'packaging/windows/update-Yuyu.ps1'
          $updateTokens = $null; $updateErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $update).Path, [ref]$updateTokens, [ref]$updateErrors)
          if ($updateErrors.Count -gt 0) { throw ("Updater PowerShell 5.1 parse errors: " + ($updateErrors | Out-String)) }
          go test ./cmd/tray
          if ($LASTEXITCODE -ne 0) { throw "tray tests failed" }

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & packaging/windows/build-resources.ps1
          if ($LASTEXITCODE -ne 0) { throw "resources failed" }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          $flags = "-s -w -X xianyu-go/internal/version.Version=dev-$($env:GITHUB_SHA.Substring(0,12)) -X xianyu-go/internal/version.Commit=$env:GITHUB_SHA"
          go build -trimpath -ldflags $flags -o dist/windows/xianyu-server.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw "server build failed" }
          go build -trimpath -ldflags "-s -w" -o dist/windows/browser-install.exe ./cmd/browser-install
          if ($LASTEXITCODE -ne 0) { throw "browser install build failed" }
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/windows/xianyu-tray.exe ./cmd/tray
          if ($LASTEXITCODE -ne 0) { throw "tray build failed" }

      - name: Cache Playwright runtime
        id: pwcache
        uses: actions/cache@v4
        with:
          path: dist/windows/playwright-runtime/amd64
          key: yuyu-win-runtime-v6-${{ hashFiles('go.mod','go.sum','cmd/browser-install/**') }}

      - name: Download Chromium and Playwright runtime
        if: steps.pwcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path (Get-Location) "dist/windows/playwright-runtime/amd64"
          $driver = Join-Path $root "playwright-driver"
          $browsers = Join-Path $root "playwright-browsers"
          New-Item -ItemType Directory -Force -Path $driver, $browsers | Out-Null
          & dist/windows/browser-install.exe -driver-dir $driver -browser-dir $browsers
          if ($LASTEXITCODE -ne 0) { throw "Playwright runtime download failed" }

      - name: Check Chromium and driver are bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/windows/playwright-runtime/amd64"
          if (-not (Test-Path "$root/playwright-driver/node.exe")) { throw "Playwright Node is missing" }
          if (-not (Test-Path "$root/playwright-driver/package/cli.js")) { throw "Playwright CLI is missing" }
          $spec = Get-Content -Raw "$root/playwright-driver/package/browsers.json" | ConvertFrom-Json
          $revision = ($spec.browsers | Where-Object name -eq "chromium").revision
          $headless = ($spec.browsers | Where-Object name -eq "chromium-headless-shell").revision
          if (-not $revision -or -not $headless) { throw "Invalid Chromium specification" }
          if (-not (Test-Path "$root/playwright-browsers/chromium-$revision")) { throw "Chromium missing" }
          if (-not (Test-Path "$root/playwright-browsers/chromium_headless_shell-$headless")) { throw "Headless shell missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Package unsigned Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:APP_VERSION = "0.0.$env:GITHUB_RUN_NUMBER"
          $short = "R:"
          if (Test-Path "$short\") { throw "R: is in use" }
          & "$env:SystemRoot/System32/subst.exe" $short $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "subst failed" }
          $pushed = $false
          try {
            Push-Location "$short\"; $pushed = $true
            $output = (Resolve-Path "dist/windows").Path
            $script = (Resolve-Path "packaging/windows/installer.iss").Path
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/O$output" $script
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          } finally {
            if ($pushed) { Pop-Location }
            & "$env:SystemRoot/System32/subst.exe" $short /D | Out-Null
          }
          if (-not (Test-Path "dist/windows/Ydisks-Xianyu-Helper-Setup.exe")) { throw "Installer missing" }

      - name: Install to verify service startup and health
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "dist/windows/Ydisks-Xianyu-Helper-Setup.exe").Path
          $log = Join-Path $env:RUNNER_TEMP "yuyu-fork-install.log"
          $proc = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log") -Wait -PassThru
          if ($proc.ExitCode -eq 0) {
            $installedUpdater = Join-Path $env:ProgramFiles 'Ydisks Xianyu Helper\update-Yuyu.ps1'
            if (-not (Test-Path -LiteralPath $installedUpdater)) { throw 'Installed Windows updater script is missing' }
          }
          if ($proc.ExitCode -ne 0) {
            Write-Host ("Installer exited with code " + $proc.ExitCode)
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            Write-Host "--- Startup logs ---"
            $logsDir = Join-Path $env:ProgramData "YdisksXianyuHelper\logs"
            if (Test-Path $logsDir) {
              Get-ChildItem -LiteralPath $logsDir -File | ForEach-Object {
                Write-Host ("Log file: " + $_.Name)
                Get-Content -LiteralPath $_.FullName -Tail 80 -ErrorAction Continue
              }
            }
            Write-Host "--- Service state ---"
            & "$env:SystemRoot\System32\sc.exe" queryex YdisksXianyuHelper
            Write-Host "--- Recent service events ---"
            Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddMinutes(-12)} -MaxEvents 20 -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Ydisks|xianyu' } |
              Select-Object TimeCreated, Id, Message | Format-List | Out-String | Write-Host
            throw "Installer failed with exit code $($proc.ExitCode)"
          }
          # The installer registers delayed-auto service. On CI runners service startup
          # can race against the first SCM status check; retry and explicitly start it.
          # A real startup failure still fails the release gate, with server diagnostics.
          $serviceScript = "C:\Program Files\Ydisks闲鱼助手\service-control.ps1"
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $service = Get-Service YdisksXianyuHelper -ErrorAction Stop
              if ($service.Status -ne "Running" -and $attempt -eq 2) {
                try {
                  Start-Service -Name YdisksXianyuHelper -ErrorAction Stop
                } catch {
                  Write-Warning ("Service start retry: " + $_.Exception.Message)
                }
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:59188/health" -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.database -eq "ok") {
                  $service.Refresh()
                  if ($service.Status -eq "Running") { $healthy = $true; break }
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw "Service health or SQLite check failed" }
          } catch {
            Write-Host "--- Windows service inspection ---"
            & sc.exe qc YdisksXianyuHelper
            & sc.exe queryex YdisksXianyuHelper
            Get-ChildItem "C:\ProgramData\YdisksXianyuHelper\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("Log: " + $_.FullName); Get-Content $_.FullName -Tail 100 -ErrorAction SilentlyContinue }
            # SCM does not persist the Go service error; retry in foreground only
            # for diagnostics on a distinct loopback port, without modifying user data.
            Write-Host "--- Capturing foreground startup failure ---"
            $program = Join-Path $env:ProgramFiles "Ydisks Xianyu Helper\xianyu-server.exe"
            $stateDir = Join-Path $env:ProgramData "YdisksXianyuHelper"
            $runtime = Join-Path $env:ProgramFiles "Ydisks Xianyu Helper\playwright-runtime"
            $stdoutPath = Join-Path $env:RUNNER_TEMP "yuyu-start-stdout.txt"
            $stderrPath = Join-Path $env:RUNNER_TEMP "yuyu-start-stderr.txt"
            if (Test-Path $program) {
              $args = @(
                "-workdir", $stateDir,
                "-data-key-file", (Join-Path $stateDir "data-key"),
                "-addr", "127.0.0.1:59189",
                "-playwright-runtime-root", $runtime
              )
              $diag = $null
              try {
                $diag = Start-Process -FilePath $program -ArgumentList $args -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
                if (-not $diag.WaitForExit(15000)) { Write-Host "Foreground process remained running for 15 seconds" }
                else { Write-Host ("Foreground exit code: " + $diag.ExitCode) }
              } catch {
                Write-Warning ("Foreground diagnostic failed: " + $_.Exception.Message)
              } finally {
                if ($diag -and -not $diag.HasExited) { Stop-Process -Id $diag.Id -Force -ErrorAction SilentlyContinue }
              }
              foreach ($logPath in @($stdoutPath, $stderrPath)) {
                if (Test-Path $logPath) { Write-Host ("Foreground log: " + $logPath); Get-Content $logPath -Tail 120 }
              }
            }
            throw
          }

      - name: SHA256 manifest and release notes
        shell: pwsh
        run: |
          $installer = "dist/windows/Ydisks-Xianyu-Helper-Setup.exe"
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Ydisks-Xianyu-Helper-Setup.exe" | Set-Content -Path "dist/windows/SHA256SUMS" -Encoding ascii
          $tag = "yuyu-win-" + $env:GITHUB_SHA.Substring(0,12)
          "Yuyu fork Windows development candidate from commit $env:GITHUB_SHA. **UNSIGNED**; review installer origin and hash. This is not a GG production deployment." | Set-Content -Path "dist/windows/RELEASE-NOTES.md" -Encoding utf8
          Write-Host "Candidate tag: $tag"
          Write-Host "SHA256: $hash"

      - name: Publish as fork-only prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "yuyu-win-" + $env:GITHUB_SHA.Substring(0,12)
          gh release create $tag "dist/windows/Ydisks-Xianyu-Helper-Setup.exe" "dist/windows/SHA256SUMS" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Yuyu Windows fork $tag (UNSIGNED)" --notes-file "dist/windows/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease publish failed" }

      - name: Upload candidate Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuyu-fork-windows-${{ github.sha }}
          path: |
            dist/windows/Ydisks-Xianyu-Helper-Setup.exe
            dist/windows/SHA256SUMS
          if-no-files-found: error
